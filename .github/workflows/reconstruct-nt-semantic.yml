name: Reconstruct NT semantic structures
on:
  workflow_dispatch:
  push:
    paths:
      - 'dados/**'
      - 'reconstrucao/scripts/gerar_semantic_layouts.py'
      - '.github/workflows/reconstruct-nt-semantic.yml'
permissions:
  contents: write
jobs:
  semantic-layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate evidence-driven semantic C layouts
        run: python3 reconstrucao/scripts/gerar_semantic_layouts.py
      - name: Compile and validate every reconstructed field offset
        run: |
          cat > /tmp/check_semantic.c <<'EOF'
          #include "reconstrucao/include/nt_semantic_layouts.h"
          int main(void) { return 0; }
          EOF
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -I. -fsyntax-only /tmp/check_semantic.c
      - name: Commit semantic layouts and resolution report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstrucao/include/nt_semantic_layouts.h reconstrucao/extraidos/semantic_reconstruction.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Reconstruir membros tipados das estruturas NT"
            git push
          fi
