name: Extract reconstructed NT C functions
on:
  workflow_dispatch:
  push:
    paths:
      - 'reconstrucao/scripts/extract_functions.py'
      - 'reconstrucao/include/ghidra_types.h'
      - '.github/workflows/extract-reconstructed-functions.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Ghidra function bodies
        run: python3 reconstrucao/scripts/extract_functions.py
      - name: Commit reconstructed C files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstrucao/src reconstrucao/extraidos/function_extraction.json reconstrucao/extraidos/REJECTED_FUNCTIONS.md
          git commit -m "Extrair corpos C decompilados do kernel NT" || exit 0
          git pull --rebase origin main
          git push
