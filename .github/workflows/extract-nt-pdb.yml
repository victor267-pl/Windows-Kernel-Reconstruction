name: Validate and extract exact NT kernel PDB
on:
  workflow_dispatch:
  push:
    paths:
      - 'reconstrucao/entrada/ntkrnlmp.pdb'
      - 'reconstrucao/scripts/extract_nt_pdb.py'
      - '.github/workflows/extract-nt-pdb.yml'
concurrency:
  group: pdb-extraction-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM PDB utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-21
          TOOL="/usr/lib/llvm-21/bin/llvm-pdbutil"
          test -x "$TOOL"
          "$TOOL" --version
          echo "LLVM_PDBUTIL=$TOOL" >> "$GITHUB_ENV"
      - name: Validate PDB identity and extract types and symbols
        run: python3 reconstrucao/scripts/extract_nt_pdb.py
      - name: Commit extraction report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reconstrucao/extraidos/PDB_EXTRACTION_REPORT.md reconstrucao/extraidos/pdb/
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Registrar diagnóstico e extração do PDB NT"
            git push
          fi
      - name: Publish PDB diagnostics and dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntkrnlmp-pdb-diagnostics
          path: |
            reconstrucao/extraidos/PDB_EXTRACTION_REPORT.md
            reconstrucao/extraidos/pdb/
          if-no-files-found: warn
          retention-days: 30
