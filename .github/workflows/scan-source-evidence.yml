name: Scan original symbol evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'reconstrucao/scripts/scan_source_evidence.py'
      - 'dados/*.txt'
      - '.github/workflows/scan-source-evidence.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search original dumps
        run: python3 reconstrucao/scripts/scan_source_evidence.py
      - name: Commit evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstrucao/extraidos/source_symbol_evidence.json reconstrucao/extraidos/SOURCE_SYMBOL_EVIDENCE.md
          git commit -m "Mapear evidencias dos simbolos nos dumps originais" || exit 0
          git pull --rebase origin main
          git push
