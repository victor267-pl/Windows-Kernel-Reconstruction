name: Diagnose reconstructed C compilation
on:
  workflow_dispatch:
  push:
    paths:
      - 'reconstrucao/scripts/diagnose_compilation.py'
      - 'reconstrucao/src/decompiled_*.c'
      - 'reconstrucao/include/ghidra_types.h'
      - '.github/workflows/diagnose-reconstructed-c.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose C syntax and missing declarations
        run: python3 reconstrucao/scripts/diagnose_compilation.py
      - name: Commit diagnostic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstrucao/extraidos/compiler_diagnostics.json reconstrucao/extraidos/COMPILER_DIAGNOSTICS.md
          git commit -m "Diagnosticar compilacao do codigo C reconstruido" || exit 0
          git push
